```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Digital Clock</title>

<style>
* { margin:0; padding:0; box-sizing:border-box; }

html, body {
  width:100%;
  height:100%;
  background:#000;
  overflow:hidden;
  font-family: monospace;
}

#stage {
  width:100%;
  height:100%;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
}

#hh, #mm, #ss, #colon {
  font-size:min(22vw, 35vh);
  font-weight:700;
  color:#E0E0D5;
}

#time-row {
  display:flex;
  align-items:baseline;
}

#ss {
  font-size:min(10vw, 15vh);
  margin-left:5px;
}

#ampm {
  font-size:min(4vw, 6vh);
  margin-left:10px;
  color:#aaa;
}

#date {
  font-size:min(3vw, 5vh);
  margin-top:10px;
  color:#888;
}

#fullscreenBtn {
  position:fixed;
  top:10px;
  left:10px;
  background:#000;
  color:#aaa;
  border:1px solid #222;
  padding:5px 10px;
  cursor:pointer;
}

</style>
</head>

<body>

<button id="fullscreenBtn">FULL</button>

<div id="stage">
  <div id="time-row">
    <span id="hh">00</span>
    <span id="colon">:</span>
    <span id="mm">00</span>
    <span id="colon">:</span>
    <span id="ss">00</span>
    <span id="ampm">AM</span>
  </div>

  <div id="date"></div>
</div>

<script>
var hh = document.getElementById('hh');
var mm = document.getElementById('mm');
var ss = document.getElementById('ss');
var ampm = document.getElementById('ampm');
var date = document.getElementById('date');

var prevH='', prevM='', prevS='', prevD='', prevA='';

var DAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
var MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

function pad(n){ return n<10 ? '0'+n : n; }

function tick(){
  var d = new Date();

  var h = d.getHours();
  var m = d.getMinutes();
  var s = d.getSeconds();

  var h12 = h%12 || 12;
  var ap = h>=12 ? 'PM':'AM';

  var hs = pad(h12);
  var ms = pad(m);
  var ssStr = pad(s);

  var ds = DAYS[d.getDay()] + " · " +
           pad(d.getDate()) + " · " +
           MONTHS[d.getMonth()] + " · " +
           d.getFullYear();

  if(hs!==prevH){ hh.textContent=hs; prevH=hs; }
  if(ms!==prevM){ mm.textContent=ms; prevM=ms; }
  if(ssStr!==prevS){ ss.textContent=ssStr; prevS=ssStr; }
  if(ap!==prevA){ ampm.textContent=ap; prevA=ap; }
  if(ds!==prevD){ date.textContent=ds; prevD=ds; }
}

tick();
setInterval(tick,1000);

document.getElementById("fullscreenBtn").onclick = () => {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen();
  } else {
    document.exitFullscreen();
  }
};
</script>

</body>
</html>

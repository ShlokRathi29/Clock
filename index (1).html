// ── AMBIENT SOUNDS ────────────────────────────────────────
// Web Audio API ambient generator
function getAudioCtx() {
  if (!STATE.audioCtx) {
    STATE.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  return STATE.audioCtx;
}

function toggleSound(type) {
  const btn = document.getElementById('snd-' + type);
  if (STATE.activeSound === type) {
    stopSound();
    btn.classList.remove('active');
    STATE.activeSound = null;
    return;
  }
  stopSound();
  document.querySelectorAll('.sound-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  STATE.activeSound = type;
  playAmbient(type);
}

function stopSound() {
  if (STATE.audioNodes.master) {
    try { STATE.audioNodes.master.gain.setTargetAtTime(0, STATE.audioCtx.currentTime, 0.3); }
    catch(e) {}
    setTimeout(() => {
      try {
        Object.values(STATE.audioNodes).forEach(n => { try { n.disconnect(); } catch(e){} });
      } catch(e) {}
      STATE.audioNodes = {};
    }, 500);
  }
}

function playAmbient(type) {
  try {
    const ctx = getAudioCtx();
    const master = ctx.createGain();
    master.gain.setValueAtTime(0, ctx.currentTime);
    master.gain.setTargetAtTime(STATE.volume, ctx.currentTime, 0.5);
    master.connect(ctx.destination);
    STATE.audioNodes.master = master;

    if (type === 'rain') {
      // Pink noise (rain simulation)
      const bufSize = ctx.sampleRate * 4;
      const buffer = ctx.createBuffer(1, bufSize, ctx.sampleRate);
      const data = buffer.getChannelData(0);
      let b0=0,b1=0,b2=0,b3=0,b4=0,b5=0,b6=0;
      for (let i=0;i<bufSize;i++) {
        const white = Math.random()*2-1;
        b0 = 0.99886*b0 + white*0.0555179;
        b1 = 0.99332*b1 + white*0.0750759;
        b2 = 0.96900*b2 + white*0.1538520;
        b3 = 0.86650*b3 + white*0.3104856;
        b4 = 0.55000*b4 + white*0.5329522;
        b5 = -0.7616*b5 - white*0.0168980;
        data[i] = (b0+b1+b2+b3+b4+b5+b6+white*0.5362) * 0.11;
        b6 = white*0.115926;
      }
      const src = ctx.createBufferSource();
      src.buffer = buffer; src.loop = true;
      const filter = ctx.createBiquadFilter();
      filter.type = 'lowpass'; filter.frequency.value = 1200;
      src.connect(filter); filter.connect(master);
      src.start();
      STATE.audioNodes.src = src;

    } else if (type === 'forest') {
      // Layered oscillators mimicking forest ambiance
      [0.5,1.2,2.1,3.4,5.8].forEach((freq, i) => {
        const osc = ctx.createOscillator();
        const g = ctx.createGain();
        osc.type = 'sine'; osc.frequency.value = freq;
        g.gain.value = 0.015 / (i+1);
        // Add slow LFO
        const lfo = ctx.createOscillator();
        const lfoG = ctx.createGain();
        lfo.frequency.value = 0.1 + i * 0.05;
        lfoG.gain.value = 0.008;
        lfo.connect(lfoG); lfoG.connect(g.gain);
        lfo.start(); osc.connect(g); g.connect(master); osc.start();
      });
      // White noise base
      const bufSize2 = ctx.sampleRate * 2;
      const buffer2 = ctx.createBuffer(1, bufSize2, ctx.sampleRate);
      const data2 = buffer2.getChannelData(0);
      for (let i=0;i<bufSize2;i++) data2[i] = (Math.random()*2-1)*0.04;
      const src2 = ctx.createBufferSource();
      src2.buffer = buffer2; src2.loop=true;
      const filt2 = ctx.createBiquadFilter();
      filt2.type='bandpass'; filt2.frequency.value=600; filt2.Q.value=0.5;
      src2.connect(filt2); filt2.connect(master); src2.start();

    } else if (type === 'cafe') {
      // Low-frequency rumble + chatter simulation
      const bufSize3 = ctx.sampleRate * 3;
      const buffer3 = ctx.createBuffer(1, bufSize3, ctx.sampleRate);
      const data3 = buffer3.getChannelData(0);
      for (let i=0;i<bufSize3;i++) data3[i] = (Math.random()*2-1)*0.08;
      const src3 = ctx.createBufferSource();
      src3.buffer = buffer3; src3.loop=true;
      const filt3 = ctx.createBiquadFilter();
      filt3.type='bandpass'; filt3.frequency.value=300; filt3.Q.value=0.8;
      src3.connect(filt3); filt3.connect(master); src3.start();

    } else if (type === 'focus') {
      // Binaural-style beats (40Hz gamma)
      const baseFreq = 200;
      const beatFreq = 40;
      ['left','right'].forEach((ch, i) => {
        const osc = ctx.createOscillator();
        const g = ctx.createGain();
        const panner = ctx.createStereoPanner();
        osc.frequency.value = baseFreq + (i === 1 ? beatFreq : 0);
        osc.type = 'sine';
        g.gain.value = 0.08;
        panner.pan.value = i === 0 ? -1 : 1;
        osc.connect(g); g.connect(panner); panner.connect(master);
        osc.start();
      });
    }
  } catch(e) { console.warn('Audio error:', e); }
}

function setVolume(v) {
  STATE.volume = parseFloat(v);
  if (STATE.audioNodes.master) {
    STATE.audioNodes.master.gain.setTargetAtTime(STATE.volume, STATE.audioCtx.currentTime, 0.1);
  }
}

// ── BEEP SOUND ────────────────────────────────────────────
function playBeep() {
  try {
    const ctx = getAudioCtx();
    [0, 0.15, 0.3].forEach(delay => {
      const osc = ctx.createOscillator();
      const g = ctx.createGain();
      osc.frequency.value = 880;
      osc.type = 'sine';
      g.gain.setValueAtTime(0.3, ctx.currentTime + delay);
      g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + delay + 0.2);
      osc.connect(g); g.connect(ctx.destination);
      osc.start(ctx.currentTime + delay);
      osc.stop(ctx.currentTime + delay + 0.2);
    });
  } catch(e) {}
}

// ── NOTIFICATION ──────────────────────────────────────────
let notifTimeout;
function showNotification(msg) {
  const el = document.getElementById('notification');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(notifTimeout);
  notifTimeout = setTimeout(() => el.classList.remove('show'), 2500);
}

// ── KEYBOARD SHORTCUTS ────────────────────────────────────
document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.contentEditable === 'true') return;

  const shortcuts = {
    'l': () => toggleSidebar('left'),
    'r': () => toggleSidebar('right'),
    't': () => toggleTheme(),
    '1': () => { setFunction('clock',null); document.querySelector('[data-fn="clock"]')?.classList.add('active'); },
    '2': () => { setFunction('timer',null); document.querySelector('[data-fn="timer"]')?.classList.add('active'); },
    '3': () => { setFunction('stopwatch',null); document.querySelector('[data-fn="stopwatch"]')?.classList.add('active'); },
    '4': () => { setFunction('pomodoro',null); document.querySelector('[data-fn="pomodoro"]')?.classList.add('active'); },
    ' ': () => {
      e.preventDefault();
      if (STATE.fnMode === 'timer') timerToggle();
      else if (STATE.fnMode === 'stopwatch') swToggle();
      else if (STATE.fnMode === 'pomodoro') pomoToggle();
    },
    'Escape': () => {
      if (STATE.leftOpen) toggleSidebar('left');
      if (STATE.rightOpen) toggleSidebar('right');
    },
    '?': () => showShortcutOverlay(),
    'd': () => setClockMode('digital',null),
    'a': () => setClockMode('analog',null),
    'm': () => setClockMode('minimal',null),
    'f': () => setClockMode('futuristic',null),
  };

  if (shortcuts[e.key]) shortcuts[e.key]();
});

function showShortcutOverlay() {
  const shortcuts = [
    ['L', 'Toggle Todo Panel'],
    ['R', 'Toggle AI Panel'],
    ['T', 'Toggle Theme'],
    ['1-4', 'Switch Function Mode'],
    ['D/A/M/F', 'Switch Clock Style'],
    ['Space', 'Play/Pause Active Timer'],
    ['Esc', 'Close Sidebars'],
    ['?', 'Show This Help'],
  ];
  showNotification('SHORTCUTS: L=Todo R=AI T=Theme 1-4=Modes Space=Play');
}

// ── RIPPLE EFFECT ─────────────────────────────────────────
document.addEventListener('click', (e) => {
  const btn = e.target.closest('.ctrl-btn, .nav-btn, .fn-tab, .mode-tab');
  if (!btn) return;
  const rect = btn.getBoundingClientRect();
  const ripple = document.createElement('div');
  ripple.className = 'ripple';
  ripple.style.cssText = `width:${Math.max(rect.width,rect.height)*2}px;height:${Math.max(rect.width,rect.height)*2}px;left:${e.clientX-rect.left-Math.max(rect.width,rect.height)}px;top:${e.clientY-rect.top-Math.max(rect.width,rect.height)}px`;
  btn.style.overflow = 'hidden'; btn.style.position = 'relative';
  btn.appendChild(ripple);
  setTimeout(() => ripple.remove(), 600);
});

// ── TODO KEYBOARD ─────────────────────────────────────────
document.getElementById('todo-input').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') addTodo();
});

// ── INIT ──────────────────────────────────────────────────
function init() {
  loadState();

  // Apply theme
  document.documentElement.setAttribute('data-theme', STATE.theme);
  const knob = document.getElementById('theme-knob');
  if (knob) knob.textContent = STATE.theme === 'dark' ? '🌙' : '☀️';

  // Apply saved states
  if (STATE.leftOpen) { document.getElementById('left-sidebar').classList.add('open'); document.getElementById('toggle-left').classList.add('open'); document.getElementById('toggle-left').innerHTML = '❮'; }
  if (STATE.rightOpen) { document.getElementById('right-sidebar').classList.add('open'); document.getElementById('toggle-right').classList.add('open'); document.getElementById('toggle-right').innerHTML = '❯'; }

  // Background
  resizeBgCanvas();
  initParticles();
  drawBg();

  // Analog ticks
  setupAnalogTicks();

  // Set initial clock mode
  setClockMode(STATE.clockMode, null);
  setFunction('clock', null);

  // Clock tick
  updateClock();
  setInterval(updateClock, 100);

  // Render data
  renderTodos();
  renderCustomLinks();

  // Insights
  showInsight();
  startInsightTimer();

  // Pomodoro init
  STATE.pomoRemaining = STATE.pomoSettings.focus * 60;

  // Resize handler
  window.addEventListener('resize', () => {
    resizeBgCanvas();
    initParticles();
  });

  // Show shortcut hint briefly
  setTimeout(() => {
    const hint = document.getElementById('shortcut-hint');
    if (hint) { hint.classList.add('visible'); setTimeout(() => hint.classList.remove('visible'), 3000); }
  }, 2000);
}

// Kick off
document.addEventListener('DOMContentLoaded', init);
</script>
